<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>🔮 塔罗占卜</title>
<script>
  // 动态生成版本号（可以使用 Date.now() 确保每次刷新都不同，或者使用随机数）
  window.APP_VERSION = 'v' + Date.now();
  document.write(`<link rel="stylesheet" href="static/css/style.css?v=${window.APP_VERSION}">`);
</script>
</head>
<body>

<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h3>📜 占卜历史</h3>
    <button class="btn-close-sidebar" onclick="toggleSidebar()">✕</button>
  </div>
  <div class="sidebar-list" id="historyList">
    <!-- History items go here -->
    <p style="text-align:center;color:var(--text-dimmer);margin-top:20px;">暂无历史记录</p>
  </div>
</div>
<button class="sidebar-toggle-btn" id="sidebarToggle" onclick="toggleSidebar()">☰</button>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<div class="header">
  <h1><span class="gradient-text">🔮 塔罗占卜</span></h1>
  <p>静心凝神，提出你的问题，让塔罗为你指引方向</p>
</div>

<div class="container">

  <!-- Settings -->
  <div class="settings-toggle">
    <button id="btnSettings" onclick="toggleSettings()">⚙️ AI 设置</button>
  </div>
  <div class="settings-panel" id="settingsPanel">
    <h3>🤖 OpenAI 兼容 API</h3>
    <div class="settings-row">
      <label>BASE_URL</label>
      <input id="apiBaseUrl" placeholder="https://api.openai.com/v1" oninput="checkSettingsChanged()">
    </div>
    <div class="settings-row">
      <label>API_KEY</label>
      <input id="apiKey" type="password" placeholder="sk-..." oninput="checkSettingsChanged()">
    </div>
    <div class="settings-row">
      <label>模型</label>
      <select id="apiModel" onchange="checkSettingsChanged()"><option value="">-- 请先获取 --</option></select>
      <button class="btn-small" id="btnFetchModels" onclick="fetchModels()">📡 获取模型列表</button>
    </div>
    <div class="settings-row">
      <label>Max Tokens</label>
      <input id="apiMaxTokens" type="number" value="4096" min="1" max="128000" oninput="checkSettingsChanged()">
    </div>
    <div class="settings-row">
      <label>占卜师风格</label>
      <div class="multi-select-container">
        <div class="multi-select-header" onclick="toggleMultiSelect()">
          <span id="selectedStylesText">选择占卜师 (0)</span>
          <span class="arrow">▼</span>
        </div>
        <div class="multi-select-dropdown" id="styleDropdown">
          <!-- 动态加载选项 -->
        </div>
      </div>
      <button class="btn-small" onclick="showPersonaManager()">🎭 管理人设</button>
    </div>
    <button class="btn-save" id="saveConfigBtn" onclick="saveApiConfig()" disabled>💾 保存配置</button>
  </div>

  <!-- Persona Manager Modal -->
  <div class="modal-overlay" id="personaModalOverlay">
    <div class="modal card">
      <div class="modal-header">
        <h3>🎭 管理占卜师人设</h3>
        <button class="btn-close-modal" onclick="closePersonaManager()">✕</button>
      </div>
      <div class="modal-body">
        <div id="personaList" class="persona-list">
          <!-- 动态加载 -->
        </div>
        <button class="btn-small mt-16" onclick="addEmptyPersona()">➕ 添加新的人设</button>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="resetPersonas()">🔄 重置为默认</button>
        <button class="btn-primary" onclick="savePersonas()">✅ 应用并关闭</button>
      </div>
    </div>
  </div>

  <!-- Question Box -->
  <div class="card" id="questionBox" style="padding: 18px 20px; margin-bottom: 20px;">
    <div style="display: flex; gap: 10px;">
      <textarea class="question-input" id="questionInput" style="flex: 1;"
        placeholder="请输入你想了解的问题，例如：我最近的事业发展方向是什么？我和TA的关系会如何发展？..."></textarea>
      <button id="btnRestartArea" class="btn-restart-vertical" onclick="resetAll()" style="display: none;">重新开始</button>
    </div>
  </div>

  <!-- Step 1: Spread Selection -->
  <div class="card" id="step1">
    <div class="step-title"><span class="step-num">1</span> 选择牌型</div>
    <p style="color:var(--text-dim);margin:0 0 8px;font-size:0.9em;">选择一种牌型：</p>
    <div class="spread-grid" id="spreadGrid"></div>
    <div class="btn-row mt-16" style="display: flex; align-items: center; gap: 15px;">
      <button class="btn-primary" id="btnStartShuffle" onclick="goToStep2()" disabled>开始洗牌 🔀</button>
      <label class="checkbox-container" style="display: flex; align-items: center; cursor: pointer; color: var(--text-dim); font-size: 0.9em; user-select: none;">
        <input type="checkbox" id="includeMinorArcana" style="margin-right: 6px; cursor: pointer;" checked onchange="onMinorArcanaChange()">
        包含小阿尔卡纳
      </label>
    </div>
  </div>

  <!-- Step 2: Shuffle & Cut -->
  <div class="card" id="step2" style="display:none;">
    <div class="step-title"><span class="step-num">2</span> 洗牌 & 切牌</div>
    <div class="shuffle-area" id="shuffleArea">
      <div class="shuffle-deck" id="shuffleDeck" onclick="doShuffle()">
        <img src="static/cards/card-back.svg" alt="牌背">
      </div>
      <p class="shuffle-counter" id="shuffleCount">点击牌堆洗牌 — 建议至少7次</p>
    </div>
    <div class="cut-area" id="cutArea" style="display:none;">
      <p style="color:var(--text-dim);margin-bottom:10px;">拖动滑块选择切牌位置（每张牌的正逆位已在洗牌时确定）</p>
      <input type="range" class="cut-slider" id="cutSlider" min="1" max="77" value="39" oninput="updateCutPreview()">
      <p class="cut-info" id="cutInfo">切牌位置: 第 39 张</p>
      <div class="btn-row mt-16">
        <button class="btn-secondary" onclick="goBackToStep1()">⬅ 返回</button>
        <button class="btn-primary" onclick="confirmCut()">确认切牌 ➤</button>
      </div>
    </div>
  </div>

  <!-- Step 3: Select Cards -->
  <div class="card" id="step3" style="display:none;">
    <div class="step-title"><span class="step-num">3</span> 凭直觉选择 <span id="selectCount">0/0</span> 张牌</div>
    <div class="card-select-grid" id="cardSelectGrid"></div>
    <div class="btn-row mt-16">
      <button class="btn-secondary" onclick="showStep(2)">⬅ 返回</button>
    </div>
  </div>

  <!-- Step 4: Reveal -->
  <div class="card" id="step4" style="display:none;">
    <div class="step-title"><span class="step-num">4</span> 牌阵展示</div>
    <div class="spread-container" id="spreadContainer">
      <div class="spread-layout" id="spreadLayout"></div>
    </div>
    
    <div class="overall-reading" id="overallReading" style="display:none;"></div>
  </div>

</div>

<!-- Card Detail Modal -->
<div class="modal-overlay" id="cardDetailModalOverlay">
  <div class="modal card card-detail-modal">
    <div class="modal-header">
      <div class="detail-title-wrapper">
        <span class="detail-pos" id="modalDetailPos">位置</span>
        <h3 id="modalDetailName">牌名</h3>
        <span class="detail-orient" id="modalDetailOrient">正位</span>
      </div>
      <button class="btn-close-modal" onclick="closeCardDetail()">✕</button>
    </div>
    <div class="modal-body">
      <div class="detail-section">
        <h4>✨ 关键词</h4>
        <p id="modalDetailKeywords" class="detail-keywords"></p>
      </div>
      <div class="detail-section">
        <h4>📜 含义解读</h4>
        <p id="modalDetailMeaning"></p>
      </div>
      <div class="detail-section">
        <h4>📖 通用说明</h4>
        <p id="modalDetailCommon"></p>
      </div>
    </div>
  </div>
</div>

<script>
  (function() {
    const scripts = [
      'static/js/config.js',
      'static/js/markdown.js',
      'static/js/api.js',
      'static/js/app.js'
    ];
    scripts.forEach(src => {
      document.write(`<script src="${src}?v=${window.APP_VERSION}"><\/script>`);
    });
  })();
</script>
</body>
</html>
